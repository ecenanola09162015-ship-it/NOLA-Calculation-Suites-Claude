[package]
name = "nola-calculation-suites"
version = "0.1.0"
description = "ÑOLA Calculation Suites desktop application"
authors = ["Ernest Nanola"]
edition = "2021"

[lib]
name = "nola_calculation_suites_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
